<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中华老当家 便当试玩</title>
  <link rel="stylesheet" href="style.css">
</head>
<body><main>
  <header><p class="eyebrow">便当试玩 · MVP 1.0</p><h1>中华老当家</h1><p>记住菜品的出场顺序，再按原顺序装进便当。</p></header>
  <section id="game">
    <div id="chapters" class="chapters" aria-label="剧情进度"></div>
    <article class="card">
      <div class="state"><strong id="order"></strong><span id="progress"></span></div>
      <p id="storage" class="small" role="status"></p>
      <p id="feedback" role="status"></p>
      <div id="stage" class="stage" aria-live="polite">准备好后开始订单</div>
      <div id="choices" class="actions"></div>
      <p id="answer"></p>
      <div class="actions">
        <button id="begin" class="primary">开始订单</button>
        <button id="undo" hidden>撤销</button><button id="hint" hidden>查看原顺序</button>
        <button id="submit" class="primary" hidden>提交便当</button>
        <button id="abort" hidden>中止本轮</button><button id="fault" hidden>记录设备异常</button>
        <button id="resume" hidden>继续测评</button>
      </div>
      <p id="report" class="report" hidden></p>
      <div class="actions end-actions">
        <button id="export">下载试玩记录</button><button id="end">提前结束测评</button><button id="reset">开始新测评</button>
      </div>
    </article>
    <details class="card"><summary>本次逐轮记录</summary><div id="gameLog"></div></details>
  </section>
  <details class="card"><summary>使用范围</summary><p>本页面用于便当试玩。记录保存在当前浏览器。规则是原型参数，适切性和测量效度仍待真实预测试。</p></details>
</main><script type="module" src="app.mjs"></script></body>
</html>
